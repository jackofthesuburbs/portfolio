<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../images/hand.png" />
<title>gary-martin — Portfolio</title>
<style>
/*
  TEMPLATE — duplicate this file per project.
  Things to swap for each project:
    - <title>
    - .project-name text
    - .description text
    - .role text (keep the "Role:" label if you like the convention)
    - .link href + text
    - the three <img> src/alt paths near the bottom
    - the back-link href, if this file doesn't live in the same folder as projects.html
*/
:root {
  --ink: #000000;
  --paper: #ffffff;
  --accent: #1506f9;
  --grey: #888888;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  line-height: 1.3;
  letter-spacing: 0.01em;
  color: var(--ink);
  background-color: var(--paper);
  margin: 0;
  padding: 20px 20px 70px;
}
p { max-width: 400px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-style: dotted; }
img {
  width: 400px;
  max-width: 100%;
  height: auto;
  border: 6px solid var(--paper);
  outline: 1px solid var(--accent);
  box-sizing: border-box;
}
.back-link {
  margin: 0 0 24px;
}
.project-name {
  font-style: italic;
  font-weight: normal;
  font-size: 21px;
  margin: 0 0 14px;
}
.description {
  margin: 0 0 16px;
}
.page-content {
  /* keeps the wrapper's real footprint matched to its (narrow) contents —
     without this, an unconstrained <div> silently claims the full page
     width as its hitbox, which throws off the image-placement math below */
  max-width: 400px;
}
.role {
  color: var(--grey);
  margin: 0 0 6px;
  font-style: italic;
}
.link {
  margin: 0;
}
ul { margin: 0; padding: 0; list-style-type: none; }
.links {
  margin: 0;
}
/* ---- the three project photos float and can be dragged, same mechanic as the homepage photo ---- */
@media screen and (min-width: 901px) {
  .float-img {
    position: fixed;
    margin: 0;
    z-index: 1;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0; /* stays invisible until JS has placed it, to avoid a flash at its static position */
  }
  .float-img.is-positioned { opacity: 1; }
  .float-img.is-dragging { cursor: grabbing; }
}
/* below the ipad/desktop breakpoint, the photos are dropped entirely —
   never shown, never stacked underneath the text */
@media screen and (max-width: 900px) {
  .float-img {
    display: none;
  }
}
/* ---- footer: fixed to the bottom of the screen, same as the homepage ---- */
.site-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background-color: var(--paper);
  border-top: 1px solid #eeeeee;
  font-size: 12px;
}
.footer-time { color: var(--grey); }
</style>
</head>
<body>
  <p class="back-link"><a href="index.html">← home</a></p>
  <div class="page-content">
    <p class="description">Selected Projects</p>
    <ul class="links">
    <li><a href="looper_remixes.html" target="_blank">Looper Remixes</a></li>
    <li><a href="practicing_scales.html" target="_blank">Practicing Scales</a></li>
    <li><a href="soundbites.html" target="_blank">Soundbites</a></li>
    <li><a href="the_expresion_orchestra.html" target="_blank">The Expression Orchestra</a></li>
    <li><a href="third_nature_recordings.html" target="_blank">Third Nature Recordings</a></li>
    <li><a href="weather_fm.html">Weather FM</a></li>
  </ul>
  </div>
  <img id="float-img-1" class="float-img" src="../images/weatherfm/weatherfm_icon.jpg" alt="Weather FM" draggable="false">
  <img id="float-img-2" class="float-img" src="../images/practicingscalesimg/performativedisassmbly.jpg" alt="Practicing Scales" draggable="false">
  <img id="float-img-3" class="float-img" src="../images/looper_remixes/looper_remixes_hero.jpg" alt="Looper Remixes" draggable="false">
  <img id="float-img-4" class="float-img" src="../images/theeo.jpg" alt="The Expression Orchestra" draggable="false">
  <img id="float-img-5" class="float-img" src="../images/thirdnature.png" alt="Third Nature Recordings" draggable="false">
  <img id="float-img-6" class="float-img" src="../images/soundbites.jpg" alt="Soundbites" draggable="false">
  <footer class="site-footer">
    <span>this website was handmade by <a href="../index.html">gary-martin</a>.</span>
    <span class="footer-time" id="footer-time"></span>
  </footer>
  <script>
    (function () {
      var floats = Array.prototype.slice.call(document.querySelectorAll('.float-img'));
      var content = document.querySelector('.page-content');
      var backLink = document.querySelector('.back-link');
      var footer = document.querySelector('.site-footer');
      var EDGE_MARGIN = 40;   // never sits snug against the side of the page
      var TEXT_BUFFER = 24;   // never hovers over/right up against text
      var SAMPLES = 250;      // candidate positions tried per image when spreading them out
      var resizeTimer;
      function footerHeight() {
        return footer ? footer.offsetHeight : 0;
      }
      function rectsClear(a, b, buffer) {
        return (
          a.right + buffer < b.left ||
          a.left - buffer > b.right ||
          a.bottom + buffer < b.top ||
          a.top - buffer > b.bottom
        );
      }
      // distance between two rects — 0 if they overlap or touch
      function rectDistance(a, b) {
        var dx = Math.max(a.left - b.right, b.left - a.right, 0);
        var dy = Math.max(a.top - b.bottom, b.top - a.bottom, 0);
        return Math.sqrt(dx * dx + dy * dy);
      }
      // Picks a random spot that never overlaps text and never goes past the
      // window/footer edge (hard constraints), then — among every valid spot it
      // sampled — keeps the one farthest from images already placed. Overlap
      // between images is allowed if the window is too small to avoid it, but
      // the images are always pushed as far apart from each other as possible.
      function findSpreadPosition(w, h, textExclusions, placedRects) {
        var maxX = window.innerWidth - w - EDGE_MARGIN;
        var maxY = window.innerHeight - footerHeight() - h - EDGE_MARGIN;
        maxX = Math.max(maxX, EDGE_MARGIN);
        maxY = Math.max(maxY, EDGE_MARGIN);
        var best = null;
        var bestScore = -Infinity;
        for (var i = 0; i < SAMPLES; i++) {
          var x = EDGE_MARGIN + Math.random() * Math.max(maxX - EDGE_MARGIN, 0);
          var y = EDGE_MARGIN + Math.random() * Math.max(maxY - EDGE_MARGIN, 0);
          var rect = { left: x, top: y, right: x + w, bottom: y + h };
          var clearOfText = textExclusions.every(function (ex) {
            return rectsClear(rect, ex, TEXT_BUFFER);
          });
          if (!clearOfText) continue;
          var score;
          if (placedRects.length === 0) {
            score = 0; // nothing placed yet — first valid spot found is as good as any
          } else {
            score = Infinity;
            for (var j = 0; j < placedRects.length; j++) {
              var d = rectDistance(rect, placedRects[j]);
              if (d < score) score = d;
            }
          }
          if (score > bestScore) {
            bestScore = score;
            best = rect;
          }
        }
        if (!best) {
          // extremely constrained viewport: no spot fully clears the text —
          // fall back to the top-left corner of the safe area rather than
          // breaking the "never over the text / never off-window" rule silently
          best = { left: EDGE_MARGIN, top: EDGE_MARGIN, right: EDGE_MARGIN + w, bottom: EDGE_MARGIN + h };
        }
        return { x: best.left, y: best.top };
      }
      function placeFloating() {
        if (window.innerWidth <= 900) {
          // images are display:none via CSS at this width — nothing to place
          floats.forEach(function (el) {
            el.style.left = '';
            el.style.top = '';
            el.classList.remove('is-positioned');
          });
          return;
        }
        var textExclusions = [];
        if (content) textExclusions.push(content.getBoundingClientRect());
        if (backLink) textExclusions.push(backLink.getBoundingClientRect());
        var placedRects = [];
        floats.forEach(function (el) {
          if (!(el.offsetWidth && el.offsetHeight)) return;
          var pos = findSpreadPosition(el.offsetWidth, el.offsetHeight, textExclusions, placedRects);
          el.style.left = pos.x + 'px';
          el.style.top = pos.y + 'px';
          el.classList.add('is-positioned');
          placedRects.push({
            left: pos.x,
            top: pos.y,
            right: pos.x + el.offsetWidth,
            bottom: pos.y + el.offsetHeight
          });
        });
      }
      var loadedCount = 0;
      floats.forEach(function (el) {
        if (el.complete) {
          loadedCount++;
        } else {
          el.addEventListener('load', function () {
            loadedCount++;
            if (loadedCount === floats.length) placeFloating();
          });
        }
      });
      placeFloating();
      window.addEventListener('resize', function () {
        if (document.hidden) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(placeFloating, 150);
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') placeFloating();
      });
      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }
      // shared counter so whichever image is picked up most recently is
      // always given a higher stacking order than every other one — and it
      // keeps that position after being dropped, instead of resetting
      var topZ = 1;
      floats.forEach(function (el) { el.style.zIndex = topZ; });
      function makeDraggable(el) {
        var dragging = false;
        var offsetX = 0;
        var offsetY = 0;
        el.addEventListener('pointerdown', function (e) {
          if (window.innerWidth <= 900) return;
          e.preventDefault();
          dragging = true;
          el.classList.add('is-dragging');
          topZ += 1;
          el.style.zIndex = topZ;
          el.setPointerCapture(e.pointerId);
          var rect = el.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
        });
        el.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          var w = el.offsetWidth;
          var h = el.offsetHeight;
          var x = clamp(e.clientX - offsetX, 0, window.innerWidth - w);
          var y = clamp(e.clientY - offsetY, 0, window.innerHeight - footerHeight() - h);
          el.style.left = x + 'px';
          el.style.top = y + 'px';
        });
        function stopDragging(e) {
          if (!dragging) return;
          dragging = false;
          el.classList.remove('is-dragging');
          // deliberately not resetting z-index here — it should stay on top
          // after being dropped, until another image is picked up
          if (el.hasPointerCapture(e.pointerId)) {
            el.releasePointerCapture(e.pointerId);
          }
        }
        el.addEventListener('pointerup', stopDragging);
        el.addEventListener('pointercancel', stopDragging);
      }
      floats.forEach(makeDraggable);
      // ---- footer clock, same as homepage ----
      var timeEl = document.getElementById('footer-time');
      function updateFooterTime() {
        var now = new Date();
        var datePart = now.toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        var timePart = now.toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit',
        });
        timeEl.textContent = datePart.toLowerCase() + ' · ' + timePart;
      }
      updateFooterTime();
      setInterval(updateFooterTime, 1000);
    })();
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/images/hands.png">
    <title>gary-martin</title>
    <style>
        *, *:before, *:after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "helvetica neue", helvetica, arial, sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-text-size-adjust: none;
            color: #000;
            line-height: 1.2;
            max-width: 400px;
            padding: 20px;
            font-size: 12px;
            background-color: #fff8e7;
            /* pins the footer to the bottom of the screen on short pages,
               same as the project pages */
            display: flex;
            flex-flow: column nowrap;
            min-height: 100vh;
        }
        .page-content {
            flex: 1 0 auto;
        }
        a {
            color: #1506f9;
            text-decoration: none;
        }
        a:hover { font-style: italic; }
        .projects {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            max-width: 400px;
        }
        .projects a {
            display: flex;
            flex-flow: column nowrap;
            gap: 4px;
            text-decoration: none;
        }
        .projects a img {
            width: 400px;
            max-width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }
        .avatar {
            display: inline-block;
            margin-right: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        p {
            max-width: 750px;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }
        ul li a {
            display: flex;
            align-items: center;
            text-decoration: none;
            width: max-content;
        }
        ul li a::after {
            display: inline-block;
            margin-left: 5px;
            content: '→';
        }
        h2 {
            font-size: 14px;
            margin-top: 40px;
        }
        h2:first-child {
            margin-top: 0;
        }
        .small {
            font-size: 10px;
            margin-top: -2px;
        }
        /* ---- footer ---- */
        .site-footer {
            margin-top: 60px;
            flex-shrink: 0;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="page-content">
    <h2>selected projects</h2>
    <div class="projects">
        <a href="weather_fm.html">
          <img src="../images/weatherfm/weatherfm_icon.jpg" alt="">
          weather fm
      </a>
      <a href="practicing_scales.html">
            <img src="../images/practicingscales.jpg" alt="">
            Practicing Scales
        </a>
      <a href="soundbites.html">
            <img src="../images/soundbites.jpg" alt="">
            Soundbites
            <span class="small">with <b>pyka</b></span>
        </a>

      <a href="third_nature.html">
          <img src="../images/thirdnature.png" alt="">
          Third Nature Recordings
      </a>
        <a href="looper_remixes.html">
            <img src="../images/looper_remixes/looper_remixes_hero.jpg" alt="">
            looper remixes
            <span class="small">with <b>pyka</b></span>
        </a>
        <a href="the_expression_orchestra.html">
            <img src="../images/theeo.jpg" alt="">
            The Expression Orchestra
            <span class="small">with <b>pyka</b></span>
        </a>

    </div>
    <br>
    </div>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
        <a href="/">gary-martin</a> · <span id="footer-date"></span>
    </footer>
    <script>
        document.getElementById('footer-date').textContent =
            new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toLowerCase();
    </script>
</body></html>

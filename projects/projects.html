<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/images/hands.png">
    <title>gary-martin</title>
    <style>
        *, *:before, *:after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "helvetica neue", helvetica, arial, sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-text-size-adjust: none;
            color: #000;
            line-height: 1.2;
            padding: 20px;
            font-size: 12px;
            background-color: #fff8e7;
        }
        a {
            color: #000;
            text-decoration: underline;
        }

        .projects {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            max-width: 1600px;
        }
        .projects a {
            display: flex;
            flex-flow: column nowrap;
            gap: 4px;
            text-decoration: none;
        }
        .projects a img {
            width: 300px;
            height: 210px;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }
        .avatar {
            display: inline-block;
            margin-right: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        p {
            max-width: 750px;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }
        ul li a {
            display: flex;
            align-items: center;
            text-decoration: none;
            width: max-content;
        }
        ul li a::after {
            display: inline-block;
            margin-left: 5px;
            content: '→';
        }
        h2 {
            font-size: 14px;
            margin-top: 40px;
        }
        .small {
            font-size: 10px;
            margin-top: -2px;
        }
    </style>
</head>
<body>

    <p style="margin-top: 0;">🪨</p>





    <h2>selected projects</h2>

    <div class="projects">


        <a href="">
          <img src="../images/weatherfm/weatherfm_icon.jpg" alt="">
          weather fm
      </a>

      <a href="">
            <img src="../images/practicingscales.jpg" alt="">
            Practicing Scales
        </a>

      <a href="">
            <img src="../images/soundbites.jpg" alt="">
            Soundbites
            <span class="small">with <b>pyka</b></span>
        </a>
      
      <a href="">
          <img src="../images/thirdnature.png" alt="">
          Third Nature Recordings
      </a>

        <a href="">
            <img src="../images/looper_remixes/looper_remixes_hero.jpg" alt="">
            looper remixes
            <span class="small">with <b>pyka</b></span>
        </a>

        <a href="">
            <img src="../images/theeo.jpg" alt="">
            The Expression Orchestra
            <span class="small">with <b>pyka</b></span>
        </a>
        

    </div>


    <br>



</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Morgans' Cafe</title>
<style>
  :root {
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --ink: #2e2a26;
    --muted: #756b60;
    --accent: #a6714f;
    --accent-soft: #f1e4d8;
    --border: #e8e0d6;
    --optional: #8a7f6b;
  }
  * { box-sizing: border-box; }
  html {
    font-size: 11px;
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 16px 80px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 400px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
    text-align: center;
  }
  #mealList {
    margin-top: 8px;
  }
  .meal {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .meal-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 16px;
    background: none;
    border: none;
    text-align: left;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  .meal-header:hover {
    background: var(--accent-soft);
  }
  .chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--muted);
    transition: transform 0.2s ease;
  }
  .meal.open .chevron {
    transform: rotate(90deg);
  }
  .meal-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .meal.open .meal-body {
    max-height: 500px;
  }
  .meal-body-inner {
    padding: 2px 18px 16px 18px;
  }
  .ingredient-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .ingredient-list li {
    padding: 4px 0 4px 20px;
    position: relative;
    color: var(--ink);
    font-size: 0.95rem;
  }
  .ingredient-list li::before {
    content: "•";
    position: absolute;
    left: 4px;
    color: var(--accent);
  }
  .optional-block {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.9rem;
    color: var(--optional);
  }
  .optional-block strong {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 4px;
  }
  .meal-select {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .meal-header-label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .meal.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .picker-section {
    margin-top: 48px;
    padding-top: 28px;
    border-top: 2px solid var(--accent-soft);
  }
  .picker-section h2 {
    font-size: 1.2rem;
    margin: 0 0 4px;
    text-align: center;
  }
  .picker-count {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 20px;
    text-align: center;
  }
  .picker-count strong {
    color: var(--accent);
  }
  .shopping-list-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 18px 20px;
  }
  .shopping-list-box h3 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .shopping-list-box h3:not(:first-child) {
    margin-top: 18px;
  }
  .shopping-list-box ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .shopping-list-box li {
    padding: 5px 0 5px 20px;
    position: relative;
    font-size: 0.95rem;
  }
  .shopping-list-box li::before {
    content: "•";
    position: absolute;
    left: 4px;
    color: var(--accent);
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
  }
  .choice-item {
    padding-left: 20px !important;
  }
  .choice-item::before {
    content: "•";
  }
  .choice-label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .choice-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .choice-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 4px 11px;
    font-size: 0.85rem;
    cursor: pointer;
    background: var(--bg);
  }
  .choice-pill:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
    font-weight: 600;
  }
  .choice-pill input {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .choice-pill.optional-pill {
    background: var(--bg);
  }
  .choice-pill.optional-pill:has(input:checked) {
    border-color: var(--optional);
    background: #efe9dc;
    color: var(--optional);
    font-weight: 600;
  }
  .choice-pill.optional-pill input {
    accent-color: var(--optional);
  }
  .meal.needs-choice {
    border-color: #c9893b;
  }
  .needs-choice-badge {
    font-size: 0.68rem;
    font-weight: 700;
    background: #c9893b;
    color: #fff;
    padding: 2px 8px;
    border-radius: 0;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .pending-box {
    margin-bottom: 16px;
    padding: 12px 14px;
    background: #fbf1e2;
    border: 1px solid #e7c48c;
    border-radius: 0;
    color: #7a5722;
    font-size: 0.88rem;
  }
  .pending-box strong {
    display: block;
    margin-bottom: 6px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .pending-box ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .pending-box li {
    padding: 3px 0;
  }
  .export-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 11px 16px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 0;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
  }
  .export-btn:hover:not(:disabled) {
    background: var(--accent);
  }
  .export-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .export-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin: 8px 0 0;
  }
  /* ---- Printable receipt ---- */
  .receipt {
    display: none;
  }
  @media print {
    body * {
      visibility: hidden;
    }
    .receipt, .receipt * {
      visibility: visible;
    }
    .receipt {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    body {
      padding: 0;
      background: #fff;
    }
  }
  .receipt {
    font-family: "Courier New", Courier, monospace;
    width: 280px;
    margin: 0 auto;
    color: #000;
    background: #fff;
    padding: 18px 14px;
    font-size: 11px;
  }
  .receipt-header {
    text-align: center;
  }
  .receipt-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .receipt-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .receipt-date {
    font-size: 10px;
    margin-top: 6px;
    color: #333;
  }
  .receipt-divider {
    border-top: 1px dashed #000;
    margin: 10px 0;
  }
  .receipt-section-title {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .receipt-lines {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .receipt-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .receipt-line .name {
    flex: 1;
  }
  .receipt-line .box {
    flex-shrink: 0;
  }
  .receipt-line .meta {
    color: #444;
    font-size: 10px;
  }
  .receipt-footer {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Morgans' Cafe</h1>
  <p class="subtitle">"what we havin' for tea?"</p>
  <div id="mealList"></div>
  <div class="picker-section">
    <h2>The Shopping List</h2>
    <p class="picker-count">how many meals? — <strong id="pickerCount">0</strong> selected</p>
    <div class="shopping-list-box" id="shoppingList">
      <p class="empty-note">select some meals to generate your ingredient list.</p>
    </div>
    <button id="exportPdfBtn" class="export-btn" disabled>Export as PDF</button>
    <p class="export-note" id="exportNote"></p>
  </div>
</div>
<div id="receipt" class="receipt">
  <div class="receipt-header">
    <div class="receipt-title">MORGAN CAFE</div>
    <div class="receipt-sub">Shopping List</div>
    <div class="receipt-date" id="receiptDate"></div>
  </div>
  <div class="receipt-divider"></div>
  <div class="receipt-section">
    <div class="receipt-section-title">Meals</div>
    <div class="receipt-lines" id="receiptMeals"></div>
  </div>
  <div class="receipt-divider"></div>
  <div class="receipt-section">
    <div class="receipt-section-title">Ingredients</div>
    <div class="receipt-lines" id="receiptIngredients"></div>
  </div>
  <div class="receipt-section" id="receiptPantrySection">
    <div class="receipt-divider"></div>
    <div class="receipt-section-title">Already Have?</div>
    <div class="receipt-lines" id="receiptPantry"></div>
  </div>
  <div class="receipt-section" id="receiptOptionalSection">
    <div class="receipt-divider"></div>
    <div class="receipt-section-title">Optional Extras</div>
    <div class="receipt-lines" id="receiptOptional"></div>
  </div>
  <div class="receipt-divider dashed"></div>
  <div class="receipt-footer">Happy cooking!<br>Morgan Cafe</div>
</div>
<script>
const meals = [
  {
    name: "Brunch",
    main: ["Toast [Bread*]"],
    optional: ["Avocado", "Eggs", "Tomatoes", "Beans"]
  },
  {
    name: "Lindas in a Bun",
    main: ["Muffin", "Sausage"],
    optional: ["Avocado"]
  },
  {
    name: "Shakshuka",
    main: ["Tomatoes", "Red Pepper", "Eggs", "Chunky Bread"],
    optional: []
  },
  {
    name: "Sandwich",
    main: ["Ciabatta", "Rocket / Lamb's Lettuce", "Tomatoes", "Cucumber", "Chutney* / Hummus / Raita [Cucumber, Mint, Yoghurt]", "Cheese* / Chicken / Fish Fingers / Falafel"],
    optional: []
  },
  {
    name: "Beans on Toast",
    main: ["Baked Beans", "Bread*"],
    optional: []
  },
  {
    name: "Peas on Toast",
    main: ["Garden Peas", "Mint Sauce", "Bread*"],
    optional: []
  },
  {
    name: "Carrot + Coriander Soup",
    main: ["Carrot", "Coriander", "Potato", "Vegetable Stock*"],
    optional: []
  },
  {
    name: "Tomato Soup",
    main: ["Tomatoes"],
    optional: ["Red Pepper", "Balsamic Vinegar*"]
  },
  {
    name: "Pea + Mint Soup",
    main: ["Peas", "Mint", "Potato"],
    optional: ["Cream"]
  },
  {
    name: "Chris' Vegetable Soup",
    main: ["Potato", "Parsnip", "Carrot", "Sage*"],
    optional: ["Swede", "Chicken"]
  },
  {
    name: "Jacket Potato",
    main: ["Sweet Potato / White Potato", "Baked Beans / Coronation Chickpea [Chickpeas, Mango Chutney] / Chilli [Beans, Tomatoes]", "Cheese*"],
    optional: []
  },
  {
    name: "Sue's Spaghetti",
    main: ["Pasta*", "Tomato Puree"],
    optional: []
  },
  {
    name: "Hidden Veg Pasta",
    main: ["Pasta*", "Tomatoes", "Red Pepper", "Courgette", "Aubergine"],
    optional: []
  },
  {
    name: "Pesto Pasta",
    main: ["Pasta*", "Pesto", "Creme Fraiche", "Peas"],
    optional: ["Salmon", "Chicken"]
  },
  {
    name: "Fajitas",
    main: ["Wraps", "Red Pepper / Chickpeas / Sweet Potato / Cauliflower / Beans"],
    optional: ["Guacamole [Avocado, Lime]", "Salsa [Tomatoes, Red Onion*, Coriander, Lime]"]
  },
  {
    name: "Naanwich",
    main: ["Naan", "Falafel / Cauliflower / Carrot / Chickpeas / Sweet Potato", "Mango Chutney / Sun-Dried Tomato Paste", "Hummus"],
    optional: []
  },
  {
    name: "Pizza",
    main: ["Frozen Dough", "Pizza Sauce / Tomatoes"],
    optional: ["Mozzarella"]
  },
  {
    name: "Year 5 Tea",
    main: ["Sausage / Burger [Burgers, Burger Buns] / Nuggets", "Chips", "Baked Beans / Peas"],
    optional: []
  },
  {
    name: "Chilli",
    main: ["Beans / Chickpeas / Sweet Potato / Red Pepper", "Tomatoes", "Rice*"],
    optional: ["Coriander", "Cinnamon", "Salsa [Tomatoes, Red Onion*, Coriander, Lime]", "Tortilla Chips"]
  },
  {
    name: "Moqueca",
    main: ["Beans", "Red Pepper", "Tomatoes", "Coconut Milk", "Coriander", "Rice*"],
    optional: []
  },
  {
    name: "Curry",
    main: ["Tomatoes", "Chickpeas / Beans / Cauliflower / Potato / Red Lentils", "Rice*"],
    optional: ["Naan", "Mango Chutney", "Raita [Cucumber, Mint, Yoghurt]", "Coconut Milk"]
  }
];
// ---- Ingredient-string parsing helpers ----
// Splits on "/" but ignores any "/" that happens to sit inside [ ... ] brackets.
function splitTopLevel(str) {
  const parts = [];
  let depth = 0;
  let current = '';
  for (const ch of str) {
    if (ch === '[') depth++;
    if (ch === ']') depth--;
    if (ch === '/' && depth === 0) {
      parts.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  parts.push(current);
  return parts.map(s => s.trim()).filter(Boolean);
}
// "Bread*" -> { name: "Bread", pantry: true }
function parseStar(s) {
  s = s.trim();
  if (s.endsWith('*')) {
    return { name: s.slice(0, -1).trim(), pantry: true };
  }
  return { name: s, pantry: false };
}
// Parses a single ingredient token, e.g. "Coronation Chickpea [Chickpeas, Mango Chutney]"
// -> { label: "Coronation Chickpea", shoppingItems: [{name:"Chickpeas",pantry:false}, {name:"Mango Chutney",pantry:false}] }
// A token with no brackets, e.g. "Bread*", resolves to a single shopping item.
function parseIngredientToken(raw) {
  const trimmed = raw.trim();
  const bracketMatch = trimmed.match(/^(.*?)\s*\[(.+)\]\s*$/);
  if (bracketMatch) {
    const label = bracketMatch[1].trim();
    const inner = bracketMatch[2];
    const shoppingItems = inner.split(',').map(parseStar);
    return { label, shoppingItems };
  }
  const parsed = parseStar(trimmed);
  return { label: parsed.name, shoppingItems: [parsed] };
}
// Parses one main-ingredient line. If it contains top-level "/" it's a multi-select choice line.
function parseMainLine(raw) {
  const rawOptions = splitTopLevel(raw);
  if (rawOptions.length > 1) {
    return { isChoice: true, options: rawOptions.map(parseIngredientToken) };
  }
  const token = parseIngredientToken(raw);
  return { isChoice: false, label: token.label, shoppingItems: token.shoppingItems };
}
const mealListEl = document.getElementById('mealList');
const selected = new Map(); // key -> meal object
const choiceState = new Map(); // key -> array parallel to meal.mainParsed; null or {chosen:[indexes]} for choice lines
const optionalChoiceState = new Map(); // key -> array of {label, shoppingItems, chosen}
function mealNeedsChoice(key) {
  const state = choiceState.get(key);
  return state.some(entry => entry && entry.chosen.length === 0);
}
function getChosenOptionalLabels(key) {
  return optionalChoiceState.get(key).filter(o => o.chosen).map(o => o.label);
}
meals.forEach(meal => {
  const key = meal.name;
  const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_');
  meal.key = key;
  meal.mainParsed = meal.main.map(parseMainLine);
  const lineState = meal.mainParsed.map(line => line.isChoice ? { chosen: [] } : null);
  choiceState.set(key, lineState);
  const optionalParsed = meal.optional.map(raw => {
    const token = parseIngredientToken(raw);
    return { label: token.label, shoppingItems: token.shoppingItems, chosen: false };
  });
  optionalChoiceState.set(key, optionalParsed);
  const mealEl = document.createElement('div');
  mealEl.className = 'meal';
  const header = document.createElement('div');
  header.className = 'meal-header';
  const labelWrap = document.createElement('button');
  labelWrap.className = 'meal-header-label';
  labelWrap.style.cssText = 'background:none;border:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;flex:1;display:flex;align-items:center;gap:10px;';
  const nameSpan = document.createElement('span');
  nameSpan.textContent = meal.name;
  labelWrap.appendChild(nameSpan);
  const badge = document.createElement('span');
  badge.className = 'needs-choice-badge';
  badge.textContent = 'Choose options';
  badge.style.display = 'none';
  labelWrap.appendChild(badge);
  labelWrap.addEventListener('click', () => {
    mealEl.classList.toggle('open');
  });
  header.appendChild(labelWrap);
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.className = 'meal-select';
  checkbox.setAttribute('aria-label', `Select ${meal.name} for shopping list`);
  checkbox.addEventListener('click', (e) => e.stopPropagation());
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) {
      selected.set(key, meal);
      mealEl.classList.add('selected');
      if (mealNeedsChoice(key)) {
        mealEl.classList.add('open');
      }
    } else {
      selected.delete(key);
      mealEl.classList.remove('selected');
    }
    refreshBadge();
    updatePickerState();
  });
  header.appendChild(checkbox);
  const chevron = document.createElement('span');
  chevron.innerHTML = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
  chevron.style.cssText = 'display:flex;cursor:pointer;';
  chevron.addEventListener('click', () => {
    mealEl.classList.toggle('open');
  });
  header.appendChild(chevron);
  const body = document.createElement('div');
  body.className = 'meal-body';
  const inner = document.createElement('div');
  inner.className = 'meal-body-inner';
  const ul = document.createElement('ul');
  ul.className = 'ingredient-list';
  meal.mainParsed.forEach((line, idx) => {
    const li = document.createElement('li');
    if (line.isChoice) {
      li.className = 'choice-item';
      const labelEl = document.createElement('span');
      labelEl.className = 'choice-label';
      labelEl.textContent = '';
      li.appendChild(labelEl);
      const optWrap = document.createElement('div');
      optWrap.className = 'choice-options';
      line.options.forEach((opt, optIdx) => {
        const pill = document.createElement('label');
        pill.className = 'choice-pill';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.name = `choice_${safeKey}_${idx}`;
        cb.value = opt.label;
        cb.addEventListener('change', () => {
          const chosen = lineState[idx].chosen;
          if (cb.checked) {
            if (!chosen.includes(optIdx)) chosen.push(optIdx);
          } else {
            const i = chosen.indexOf(optIdx);
            if (i > -1) chosen.splice(i, 1);
          }
          refreshBadge();
          if (selected.has(key)) renderShoppingList();
        });
        pill.appendChild(cb);
        pill.appendChild(document.createTextNode(opt.label));
        optWrap.appendChild(pill);
      });
      li.appendChild(optWrap);
    } else {
      li.textContent = line.label;
    }
    ul.appendChild(li);
  });
  inner.appendChild(ul);
  if (optionalParsed.length) {
    const optBlock = document.createElement('div');
    optBlock.className = 'optional-block';
    const strongLabel = document.createElement('strong');
    strongLabel.textContent = 'Extras';
    optBlock.appendChild(strongLabel);
    const optWrap = document.createElement('div');
    optWrap.className = 'choice-options';
    optionalParsed.forEach(o => {
      const pill = document.createElement('label');
      pill.className = 'choice-pill optional-pill';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = o.label;
      cb.addEventListener('change', () => {
        o.chosen = cb.checked;
        if (selected.has(key)) renderShoppingList();
      });
      pill.appendChild(cb);
      pill.appendChild(document.createTextNode(o.label));
      optWrap.appendChild(pill);
    });
    optBlock.appendChild(optWrap);
    inner.appendChild(optBlock);
  }
  body.appendChild(inner);
  mealEl.appendChild(header);
  mealEl.appendChild(body);
  mealListEl.appendChild(mealEl);
  function refreshBadge() {
    const needs = mealNeedsChoice(key) && selected.has(key);
    badge.style.display = needs ? 'inline-flex' : 'none';
    mealEl.classList.toggle('needs-choice', needs);
  }
});
const pickerCountEl = document.getElementById('pickerCount');
const shoppingListEl = document.getElementById('shoppingList');
const exportBtn = document.getElementById('exportPdfBtn');
const exportNoteEl = document.getElementById('exportNote');
const receiptDateEl = document.getElementById('receiptDate');
const receiptMealsEl = document.getElementById('receiptMeals');
const receiptIngredientsEl = document.getElementById('receiptIngredients');
const receiptPantrySectionEl = document.getElementById('receiptPantrySection');
const receiptPantryEl = document.getElementById('receiptPantry');
const receiptOptionalSectionEl = document.getElementById('receiptOptionalSection');
const receiptOptionalEl = document.getElementById('receiptOptional');
function updatePickerState() {
  pickerCountEl.textContent = selected.size;
  renderShoppingList();
}
// Gathers the resolved ingredient data shared by the on-screen list and the printable receipt.
// Ingredients marked with * always land in "pantryItems", regardless of whether they came from
// a required or optional line. Everything else required (non-pantry) lands in "mainItems" and
// takes priority over the same ingredient appearing elsewhere as optional or pantry.
function computeShoppingListData() {
  const mainSet = new Map();
  const pantrySet = new Map();
  const optionalSet = new Map();
  const pending = [];
  function addRequired(si) {
    const k = si.name.trim().toLowerCase();
    if (si.pantry) {
      if (!pantrySet.has(k)) pantrySet.set(k, si.name.trim());
    } else {
      mainSet.set(k, si.name.trim());
      if (pantrySet.has(k)) pantrySet.delete(k);
    }
  }
  // Pass 1: required ingredients (fixed lines + chosen options)
  selected.forEach(meal => {
    const lineState = choiceState.get(meal.key);
    meal.mainParsed.forEach((line, idx) => {
      if (line.isChoice) {
        const entry = lineState[idx];
        if (entry.chosen.length > 0) {
          entry.chosen.forEach(optIdx => {
            line.options[optIdx].shoppingItems.forEach(addRequired);
          });
        } else {
          pending.push({ mealName: meal.name, options: line.options.map(o => o.label).join(' / ') });
        }
      } else {
        line.shoppingItems.forEach(addRequired);
      }
    });
  });
  // Pass 2: selected optional extras (skip anything already required)
  selected.forEach(meal => {
    const optState = optionalChoiceState.get(meal.key);
    optState.forEach(o => {
      if (!o.chosen) return;
      o.shoppingItems.forEach(si => {
        const k = si.name.trim().toLowerCase();
        if (mainSet.has(k)) return;
        if (si.pantry) {
          if (!pantrySet.has(k)) pantrySet.set(k, si.name.trim());
        } else {
          if (!pantrySet.has(k) && !optionalSet.has(k)) optionalSet.set(k, si.name.trim());
        }
      });
    });
  });
  return {
    meals: [...selected.values()],
    mainItems: [...mainSet.values()].sort((a, b) => a.localeCompare(b)),
    pantryItems: [...pantrySet.values()].sort((a, b) => a.localeCompare(b)),
    optionalItems: [...optionalSet.values()].sort((a, b) => a.localeCompare(b)),
    pending
  };
}
function renderShoppingList() {
  if (selected.size === 0) {
    shoppingListEl.innerHTML = '<p class="empty-note">Select some meals to generate your ingredient list.</p>';
    updateExportState(null);
    return;
  }
  const { meals: selMeals, mainItems, pantryItems, optionalItems, pending } = computeShoppingListData();
  let html = '';
  if (pending.length) {
    html += '<div class="pending-box"><strong>Still need your choice</strong><ul>' +
      pending.map(p => `<li>${p.mealName}: ${p.options}</li>`).join('') +
      '</ul></div>';
  }
  html += '<h3>Selected meals</h3><ul>' +
    selMeals.map(m => {
      const withLabels = getChosenOptionalLabels(m.key);
      const withText = withLabels.length ? ` <span style="color:var(--muted);">(with ${withLabels.join(', ')})</span>` : '';
      return `<li>${m.name}${withText}</li>`;
    }).join('') +
    '</ul>';
  html += '<h3>Ingredients to get</h3>' +
    (mainItems.length ? '<ul>' + mainItems.map(item => `<li>${item}</li>`).join('') + '</ul>' : '<p class="empty-note">Make your choices above to fill this in.</p>');
  if (pantryItems.length) {
    html += '<h3>Should have already?</h3><ul>' +
      pantryItems.map(item => `<li>${item}</li>`).join('') +
      '</ul>';
  }
  if (optionalItems.length) {
    html += '<h3>Extras to get</h3><ul>' +
      optionalItems.map(item => `<li>${item}</li>`).join('') +
      '</ul>';
  }
  shoppingListEl.innerHTML = html;
  updateExportState({ meals: selMeals, pending });
  updateReceipt({ meals: selMeals, mainItems, pantryItems, optionalItems });
}
function updateExportState(listData) {
  const hasPending = listData && listData.pending && listData.pending.length > 0;
  const hasMeals = listData && listData.meals && listData.meals.length > 0;
  exportBtn.disabled = !hasMeals || hasPending;
  if (!hasMeals) {
    exportNoteEl.textContent = '';
  } else if (hasPending) {
    exportNoteEl.textContent = 'Finish choosing ingredient options above before exporting.';
  } else {
    exportNoteEl.textContent = '';
  }
}
function updateReceipt({ meals: selMeals, mainItems, pantryItems, optionalItems }) {
  receiptDateEl.textContent = new Date().toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  receiptMealsEl.innerHTML = selMeals.map(m => {
    const withLabels = getChosenOptionalLabels(m.key);
    const withLine = withLabels.length ? `<div class="receipt-line"><span class="meta">with ${withLabels.join(', ')}</span></div>` : '';
    return `<div class="receipt-line"><span class="name">${m.name}</span></div>${withLine}`;
  }).join('');
  receiptIngredientsEl.innerHTML = mainItems.map(item =>
    `<div class="receipt-line"><span class="name">${item}</span><span class="box">[ ]</span></div>`
  ).join('');
  if (pantryItems.length) {
    receiptPantrySectionEl.style.display = '';
    receiptPantryEl.innerHTML = pantryItems.map(item =>
      `<div class="receipt-line"><span class="name">${item}</span><span class="box">[ ]</span></div>`
    ).join('');
  } else {
    receiptPantrySectionEl.style.display = 'none';
    receiptPantryEl.innerHTML = '';
  }
  if (optionalItems.length) {
    receiptOptionalSectionEl.style.display = '';
    receiptOptionalEl.innerHTML = optionalItems.map(item =>
      `<div class="receipt-line"><span class="name">${item}</span><span class="box">[ ]</span></div>`
    ).join('');
  } else {
    receiptOptionalSectionEl.style.display = 'none';
    receiptOptionalEl.innerHTML = '';
  }
}
exportBtn.addEventListener('click', () => {
  if (exportBtn.disabled) return;
  window.print();
});
</script>
</body>
</html>
